# Render Blueprint: the web app, the API and PostgreSQL on Render's free plan.
# Secrets are generated by Render; nothing secret is in this file.

envVarGroups:
  # One shared value, so the web server and the API always agree.
  - name: meeting-scheduler-shared
    envVars:
      - key: API_SECRET
        generateValue: true

databases:
  - name: meeting-scheduler-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: meeting_scheduler
    user: meeting_scheduler

services:
  - type: web
    name: meeting-scheduler-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys only after the GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - api/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-scheduler-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Public addresses: free services cannot receive private-network traffic.
      # Render adds a suffix to the names, and so to the addresses.
      - key: BETTER_AUTH_URL
        value: https://meeting-scheduler-demo-api-mpt5.onrender.com
      - key: WEB_ORIGIN
        value: https://meeting-scheduler-demo-web-mpt5.onrender.com
      - fromGroup: meeting-scheduler-shared

  - type: web
    name: meeting-scheduler-demo-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: API_URL
        value: https://meeting-scheduler-demo-api-mpt5.onrender.com
      - fromGroup: meeting-scheduler-shared
