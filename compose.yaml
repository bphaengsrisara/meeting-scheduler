# Local PostgreSQL for development: docker compose up -d db
# The project name keeps the volume name unique to this repo.
name: meeting-scheduler

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_scheduler
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
