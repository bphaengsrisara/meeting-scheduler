name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The same database as the db service in compose.yaml.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meeting_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meeting_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example values are for local use only and match the db service.
      - name: Create the .env files
        run: |
          cp api/.env.example api/.env
          cp web/.env.example web/.env

      - run: pnpm --filter api db:migrate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Install the Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:e2e
